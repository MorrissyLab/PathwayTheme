# The three pairwise contrasts among tumour, normal and cell line.
#
# The one-vs-rest version of this lives in gobp_sampletype.yaml; these are the
# explicit pairs, which is what the tumour-versus-normal question actually asks.
#
#   TUMOR     (658) vs NORMAL (118)   -- malignancy
#   CELL_LINE (130) vs NORMAL (118)   -- model versus tissue
#   CELL_LINE (130) vs TUMOR  (658)   -- what culture costs
#
# One caveat belongs on the first two: the normals carry no diagnosis or tissue
# label in the run sheet, so this contrast cannot be matched by tissue of origin
# the way gobp_matched.yaml matches by diagnosis.  A tissue-specific theme here
# is therefore ambiguous between malignancy and tissue composition, and the
# manuscript says so.
#
#   cd manuscript && uv run pathwaytheme run configs/gobp_tumor_normal.yaml

input:
  kind: matrix
  matrix_path: "data/processed/expression_log2.tsv"
  metadata_path: "data/processed/metadata.tsv"
  sep: "\t"

enrichment:
  backend: ssgsea
  geneset: GOBP
  gmt_path: "data/genesets/GOBP.gmt"
  min_gene_set_size: 10
  max_gene_set_size: 500
  threads: 8
  cache_dir: "results/scores"

grouping:
  mode: target
  target_col: "sample_type"
  secondary_col: "diagnosis"

pca:
  k_max: 10
  elbow_components: 3

metadata:
  enabled: true
  # Three run-sheet columns are excluded on purpose.  `sequencing_centre` is
  # constant -- the cohort is restricted to the public RNAseq Landscape centre --
  # so it has no levels to separate.  `batch` is a delivered column whose values
  # are literally "<Sample Type>@<Sequencing Centre>", which with one centre
  # makes it `sample_type` re-spelled.  `run_id` resolves individual flowcells,
  # most of them below the size floor.
  columns: ["diagnosis", "sample_type",
            "library_type", "rin", "seq_kit", "zero_fraction"]
  technical: ["library_type", "rin", "seq_kit", "zero_fraction"]
  min_group_size: 3
  plot_components: 6
  # also test each level of each categorical variable against the rest, so a
  # component can be attributed to one subtype rather than to "diagnosis"
  per_level: true

diff:
  enabled: true
  method: moderated_t
  contrasts:
    - ["TUMOR", "NORMAL"]
    - ["CELL_LINE", "NORMAL"]
    - ["CELL_LINE", "TUMOR"]
  top_n: 25

categories:
  enabled: true
  map_path: "data/genesets/gobp_category_map.tsv"
  key_col: pathway
  category_col: category
  stat: mean
  split_significance: true
  significance_col: fdr
  alpha: 0.05

viz:
  # The PCA clustermaps over ~5,000 GO:BP terms take longer than the whole rest
  # of the run and none of them is a panel in a one-figure note.  Tables are
  # what the manuscript reads, and analysis.figures composes the figures
  # from them using the same package plot functions.
  make_figures: false
  make_tables: true

output_dir: "results/pipeline/gobp_tumor_normal"
